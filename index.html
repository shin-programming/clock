<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>時計</title>
        <style>
            :root {
                --font-size-date: 100vw;
                --font-size-clock: 100vw;
            }

            * {
                margin: 0;
                cursor: default;
                user-select: none;
                font-family: "MS Gothic", "ＭＳ ゴシック", monospace;
            }

            html, body {
                width: 100vw; height: 100vh;
                display: flex;
                overflow: hidden;
                align-items: center;
                flex-direction: column;
                justify-content: center;
            }

            #date { font-size: calc(var(--font-size-date) / 34); }

            #clock { font-size: calc(var(--font-size-clock) / 7); }
        </style>
    </head>
    <body>
        <p id="date"></p>
        <h1 id="clock"></h1>
        <script>
            const dateText = document.getElementById('date');
            const clockText = document.getElementById('clock');
            const week = ['日', '月', '火', '水', '木', '金', '土'];
            let isDark = false;

            function updateClock() {
                const now = new Date();

                const year = String(now.getFullYear());
                const month = String(now.getMonth() + 1);
                const date = String(now.getDate());
                const day = week[now.getDay()];

                const hour = String(now.getHours());
                const minute = String(now.getMinutes()).padStart(2, '0');
                const second = String(now.getSeconds()).padStart(2, '0');

                dateText.textContent = `${year}年${month}月${date}日　${day}曜日`;
                clockText.textContent = `${hour}:${minute}:${second}`;
            }

            updateClock();
            setInterval(updateClock, 100);

            window.addEventListener('click', () => {
                isDark = !isDark
                document.body.style.backgroundColor = isDark ? '#000' : '#fff';
                document.body.style.color = isDark ? '#fff' : '#000';
            });
        </script>
    </body>
</html>
