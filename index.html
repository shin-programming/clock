<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>時計</title>
        <style>
            :root {
                --font-size-date: 100vw;
                --font-size-clock: 100vw;
            }

            * {
                margin: 0;
                cursor: default;
                user-select: none;
                font-family: system-ui;
            }

            html, body {
                width: 100vw; height: 100vh;
                display: flex;
                overflow: hidden;
                align-items: center;
                flex-direction: column;
                justify-content: center;
            }

            #date { font-size: calc(var(--font-size-date) / 34); }

            #clock {
                font-weight: bolder;
                font-size: calc(var(--font-size-clock) / 7);
            }

            #LD-toggle-btn {
                top: 0; left: 0;
                width: 60px; height: 60px;
                border: none;
                display: flex;
                transition: 0.3s;
                position: absolute;
                align-items: center;
                flex-direction: column;
                justify-content: center;
                background-color: #0000;
            }

            #LD-toggle-btn:hover {
                width: 70px; height: 70px;
            }

            #btn-img {
                width: 100%; height: 100%;
            }
        </style>
    </head>
    <body>
        <p id="date"></p>
        <h1 id="clock"></h1>
        <button id="LD-toggle-btn">
            <img src="img/dark.svg" id="btn-img" alt="dark" title="ダークモードに切り替え" draggable="false">
        </button>
        <script>
            const dateText = document.getElementById('date');
            const clockText = document.getElementById('clock');
            const week = ['日', '月', '火', '水', '木', '金', '土'];
            let isDark = false;

            function updateClock() {
                const now = new Date();

                const year = String(now.getFullYear());
                const month = String(now.getMonth() + 1);
                const date = String(now.getDate());
                const day = week[now.getDay()];

                const hour = String(now.getHours());
                const minute = String(now.getMinutes()).padStart(2, '0');
                const second = String(now.getSeconds()).padStart(2, '0');

                dateText.textContent = `${year}年${month}月${date}日　${day}曜日`;
                clockText.textContent = `${hour}:${minute}:${second}`;
            }

            updateClock();
            setInterval(updateClock, 100);

            document.getElementById('LD-toggle-btn').addEventListener('pointerdown', () => {
                isDark = !isDark
                const img = document.getElementById('btn-img');

                if (isDark) {
                    Object.assign(img, {
                        src: 'img/light.svg',
                        alt: 'light',
                        title: 'ライトモードに切り替え'
                    });
                } else {
                    Object.assign(img, {
                        src: 'img/dark.svg',
                        alt: 'dark',
                        title: 'ダークモードに切り替え'
                    });
                }
            });

            let hue = 0;

            function updateColor() {
                if (isDark) {
                    document.body.style.background = '#000';
                    dateText.style.color = `hsl(${hue}, 100%, 77%)`;
                    clockText.style.color = `hsl(${hue}, 100%, 77%)`;
                } else {
                    document.body.style.background = `linear-gradient(45deg, hsl(${hue}, 100%, 77%), hsl(${(hue + 60) % 360}, 100%, 77%))`;
                    dateText.style.color = '#000';
                    clockText.style.color = '#000';
                }

                hue = (hue + 0.18) % 360;
                requestAnimationFrame(updateColor);
            }

            updateColor();
        </script>
    </body>
</html>
